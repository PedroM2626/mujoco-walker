name: tests

# Actions logs are not readable without authentication, which makes a red X here
# useless to anyone outside the account. On failure each job therefore posts the
# one-line reason to the commit status via the built-in GITHUB_TOKEN; commit
# statuses are public, so the cause is readable from the API or the commits page.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ragdoll-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # MuJoCo's wheel ships its own binaries; these cover the GL paths the
      # rendering-based scripts touch if they are ever added here.
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libosmesa6 libgl1 libglx-mesa0
          echo "MUJOCO_GL=osmesa" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU wheels: the runner has no GPU and the tests never train.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
          python -c "import gymnasium,numpy,mujoco,torch;print('versions:',gymnasium.__version__,numpy.__version__,mujoco.__version__,torch.__version__)"

      - name: Unit tests (env, golden reward math, parallel vec parity, checkpoints, race)
        run: python -m unittest discover -s tests -t . -v 2>&1 | tee ragdoll-tests.log

      - name: Environment throughput smoke (no assertions, catches crashes)
        run: python bench_env.py --mode env --seconds 3

      - name: Report failure reason
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REASON=$(grep -oE "(FAILED|ERROR): [^ ]+|ModuleNotFoundError.*|ImportError.*|AssertionError.*" ragdoll-tests.log | tail -3 | tr '\n|' '  ' | cut -c1-130)
          [ -z "$REASON" ] && REASON="no test failure line found (setup or timeout)"
          echo "::notice title=ragdoll-suite failure::$REASON"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"failure\",\"context\":\"ci/ragdoll-suite\",\"description\":\"$REASON\"}"

  # The Phase-4 scripts need gymnasium>=1.0 for Walker2d-v5 and cannot share the
  # interpreter above, so they get their own install.
  phase4-imports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Phase 4 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-phase4.txt
      - name: Walker2d-v5 and trainer modules import
        run: |
          python - <<'PY'
          import gymnasium as gym
          env = gym.make("Walker2d-v5")
          assert env.observation_space.shape == (17,), env.observation_space
          assert env.action_space.shape == (6,), env.action_space
          env.close()

          import sys
          sys.path.insert(0, "openai_walker")
          import stable_baselines3
          for module in ("train_bc", "train_iql", "train_cql", "train_offline_bcq",
                         "train_offline_dt", "train_irl_gail", "evaluate_all"):
              __import__(module)
              print("import ok:", module)
          print("gymnasium", gym.__version__, "| sb3", stable_baselines3.__version__)
          PY

      # Behavioural, not just importable. Note most model files are gitignored, so on
      # CI this legitimately covers the tracked dataset + teacher and skips the rest;
      # it prints what it skipped so a silent shrink of coverage is visible.
      - name: Phase 4 behavioural tests
        run: python -m unittest tests.test_phase4_behaviour -v 2>&1 | tee phase4-tests.log

      - name: Report failure reason
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REASON=$(grep -oE "(FAILED|ERROR): [^ ]+|ModuleNotFoundError.*|ImportError.*|AssertionError.*" phase4-tests.log | tail -3 | tr '\n|' '  ' | cut -c1-130)
          [ -z "$REASON" ] && REASON="no test failure line found (setup or timeout)"
          echo "::notice title=phase4 failure::$REASON"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"failure\",\"context\":\"ci/phase4\",\"description\":\"$REASON\"}"
